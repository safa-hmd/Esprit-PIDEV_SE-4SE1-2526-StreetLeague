<!-- HEADER -->
<header class="dfo-header">
  <div class="dfo-header-left">
    <button class="dfo-menu-toggle" (click)="toggleSidebar()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="dfo-logo">
      Street<span>League</span>
      <span class="dfo-logo-badge">🚚 Delivery Man</span>
    </div>
  </div>
  <div class="dfo-header-right">
    <div class="dfo-user">
      <div class="dfo-user-name" style="color: #ffffff; font-weight: 700;">{{ deliveryName }}</div>
      <div class="dfo-user-role" style="color: #aaaaaa;">Delivery Man</div>
    </div>
    <button class="dfo-logout-btn" (click)="logout()" title="Déconnexion">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path d="M17 16l4-4m0 0l-4-4m4 4H7"/>
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      </svg>
    </button>
  </div>
</header>

<!-- SIDEBAR -->
<aside class="dfo-sidebar" [class.collapsed]="!sidebarOpen">
  <nav class="dfo-nav">
    <div class="dfo-nav-section-label">Navigation</div>

    <a routerLink="/delivery/mes-livraisons" routerLinkActive="dfo-link-active" class="dfo-link">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="18" height="18">
        <rect x="1" y="3" width="15" height="13"/>
        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      <span>My Deliveries</span>
    </a>

   <a routerLink="/delivery/historique" routerLinkActive="dfo-link-active" class="dfo-link">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="18" height="18">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>History</span>
    </a>

    <div class="dfo-nav-divider"></div>
    <div class="dfo-nav-section-label">Status</div>

    <div class="dfo-status-legend">
      <div class="dfo-legend-item">
        <span class="dfo-dot orange"></span> PREPARED
      </div>
      <div class="dfo-legend-item">
        <span class="dfo-dot blue"></span> SHIPPED
      </div>
      <div class="dfo-legend-item">
        <span class="dfo-dot blue"></span> IN PROGRESS
      </div>
      <div class="dfo-legend-item">
        <span class="dfo-dot green"></span> DELIVERED
      </div>
      <div class="dfo-legend-item">
        <span class="dfo-dot red"></span> FAILED
      </div>
    </div>
  </nav>
</aside>

<!-- OVERLAY mobile -->
<div class="dfo-overlay" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

<!-- MAIN CONTENT -->
<main class="dfo-main" [class.sidebar-open]="sidebarOpen">
  <router-outlet></router-outlet>
</main>
