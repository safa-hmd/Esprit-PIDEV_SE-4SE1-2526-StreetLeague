<div class="card">

  <div class="card-head">
    <div class="logo">Street<span>League</span></div>
    <h2>Forgot your password?</h2>
    <p>Enter your email to receive a reset link</p>
  </div>

  <div class="card-body">

    <div class="success-msg" *ngIf="successMsg">✅ {{ successMsg }}</div>
    <div class="error-msg"   *ngIf="errorMsg">{{ errorMsg }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="your@email.com"
          [class.input-error]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        <small class="field-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Invalid email address.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || isLoading">
        <span class="spinner-ring" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Sending...' : 'Send reset link' }}</span>
      </button>
    </form>

  </div>

  <div class="card-footer">
    <a routerLink="/login">← Back to login</a>
  </div>

</div>
