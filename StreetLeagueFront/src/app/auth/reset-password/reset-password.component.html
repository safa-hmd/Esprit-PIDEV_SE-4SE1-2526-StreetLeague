<div class="card">

  <div class="card-head">
    <div class="logo">Street<span>League</span></div>
    <h2>New Password</h2>
    <p>Choose a secure new password</p>
  </div>

  <div class="card-body">

    <div class="success-msg" *ngIf="successMsg">✅ {{ successMsg }}</div>
    <div class="error-msg"   *ngIf="errorMsg">{{ errorMsg }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMsg">

      <div class="form-group">
        <label for="newPassword">New password</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          placeholder="••••••••"
          [class.input-error]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
        />
        <small class="field-error"
          *ngIf="form.get('newPassword')?.errors?.['minlength'] && form.get('newPassword')?.touched">
          Minimum 6 characters.
        </small>
        <small class="field-error"
          *ngIf="form.get('newPassword')?.errors?.['required'] && form.get('newPassword')?.touched">
          Password is required.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="••••••••"
          [class.input-error]="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched"
        />
        <small class="field-error"
          *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched">
          Passwords do not match.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || isLoading">
        <span class="spinner-ring" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Saving...' : 'Reset password' }}</span>
      </button>

    </form>

  </div>

  <div class="card-footer">
    <a routerLink="/login">← Back to login</a>
  </div>

</div>
