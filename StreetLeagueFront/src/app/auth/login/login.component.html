<div class="card">

  <!-- Header -->
  <div class="card-head">
    <div class="logo">Street<span>League</span></div>
    <h2>Welcome back!</h2>
    <p>Sign in to your account</p>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- ── Rôles (dont Admin → même API login, redirection /admin) ── -->
    <div class="role-select">
      <button type="button" class="role-btn" [class.active]="selectedRole === 'PLAYER'" (click)="selectRole('PLAYER')">
        <span class="role-emoji">👤</span>
        <span class="role-label">Player</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'COACH'" (click)="selectRole('COACH')">
        <span class="role-emoji">🎯</span>
        <span class="role-label">Coach</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'SPONSOR'" (click)="selectRole('SPONSOR')">
        <span class="role-emoji">💼</span>
        <span class="role-label">Sponsor</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'DELIVERY'" (click)="selectRole('DELIVERY')">
        <span class="role-emoji">🚚</span>
        <span class="role-label">Delivery</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'ADMIN'" (click)="selectRole('ADMIN')">
        <span class="role-emoji">🛡️</span>
        <span class="role-label">Admin</span>
      </button>
    </div>

    <!-- Error message -->
    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

    <!-- Angular Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [placeholder]="emailPlaceholder"
          [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <small class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Invalid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <small class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        <span class="spinner-ring" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Signing in...' : 'Sign in as ' + roleLabel }}</span>
      </button>

    </form>

  </div>

  <div style="text-align: right; margin-top: -0.5rem; margin-bottom: 1rem; padding: 0 2rem;">
    <a routerLink="/forgot-password" style="font-size: 0.82rem; color: var(--red); font-weight: 600; text-decoration: none;">
      Forgot your password?
    </a>
  </div>

  <div class="divider"><span>or</span></div>

  <button type="button" class="btn-google" (click)="loginWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.6 2.5 30.1 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.2 13 17.7 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"/>
      <path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/>
      <path fill="#34A853" d="M24 48c6.1 0 11.2-2 14.9-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.4 2.2-6.3 0-11.7-4.2-13.6-10l-7.8 6C6.6 42.6 14.6 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <!-- Footer -->
  <div class="card-footer">
    Don't have an account?
    <a routerLink="/register">Sign up</a>
  </div>

</div>
