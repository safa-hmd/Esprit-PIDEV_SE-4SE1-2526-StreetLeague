

<div class="card">

  <!-- En-tête -->
  <div class="card-head">
    <div class="logo">Street<span>League</span></div>
    <h2>Bienvenue !</h2>
    <p>Connectez-vous à votre compte</p>
  </div>

  <!-- Corps -->
  <div class="card-body">

    <!-- ── 5 Rôles ── -->
    <div class="role-select">
      <button type="button" class="role-btn" [class.active]="selectedRole === 'PLAYER'" (click)="selectRole('PLAYER')">
        <span class="role-emoji">👤</span>
        <span class="role-label">Joueur</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'ADMIN'" (click)="selectRole('ADMIN')">
        <span class="role-emoji">🛡️</span>
        <span class="role-label">Admin</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'COACH'" (click)="selectRole('COACH')">
        <span class="role-emoji">🎯</span>
        <span class="role-label">Coach</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'SPONSOR'" (click)="selectRole('SPONSOR')">
        <span class="role-emoji">💼</span>
        <span class="role-label">Sponsor</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'DELIVERY'" (click)="selectRole('DELIVERY')">
        <span class="role-emoji">🚚</span>
        <span class="role-label">Livraison</span>
      </button>
    </div>

    <!-- Message d'erreur -->
    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

    <!-- Formulaire Angular -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [placeholder]="emailPlaceholder"
          [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <small class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Adresse email invalide.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <small class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mot de passe requis.
        </small>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        <span class="spinner-ring" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Connexion...' : 'Se connecter en tant que ' + roleLabel }}</span>
      </button>

    </form>
  </div>

  <!-- Pied de carte -->
  <div class="card-footer">
    Pas encore de compte ?
    <a routerLink="/register">S'inscrire</a>
  </div>

</div>
