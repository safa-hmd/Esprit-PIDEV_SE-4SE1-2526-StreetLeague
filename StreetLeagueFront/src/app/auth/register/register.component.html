<div class="register-wrapper">
  <div class="card">

<div class="card">

  <!-- Header -->
  <div class="card-head">
    <div class="logo">Street<span>League</span></div>
    <h2>Create an account</h2>
    <p>Join the StreetLeague community</p>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- ── 5 rôles : Player, Coach, Sponsor, Delivery, Admin ── -->
    <div class="role-select">
      <button type="button" class="role-btn" [class.active]="selectedRole === 'PLAYER'" (click)="selectRole('PLAYER')">
        <span class="role-emoji">👤</span>
        <span class="role-label">Player</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'COACH'" (click)="selectRole('COACH')">
        <span class="role-emoji">🎯</span>
        <span class="role-label">Coach</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'SPONSOR'" (click)="selectRole('SPONSOR')">
        <span class="role-emoji">💼</span>
        <span class="role-label">Sponsor</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'DELIVERY'" (click)="selectRole('DELIVERY')">
        <span class="role-emoji">🚚</span>
        <span class="role-label">Delivery</span>
      </button>
      <button type="button" class="role-btn" [class.active]="selectedRole === 'ADMIN'" (click)="selectRole('ADMIN')">
        <span class="role-emoji">🛡️</span>
        <span class="role-label">Admin</span>
      </button>
    </div>

    <!-- Messages -->
    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success-msg" *ngIf="successMessage">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      {{ successMessage }}
    </div>

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- First Name + Last Name -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" formControlName="firstName" placeholder=""
            [class.input-error]="f['firstName'].invalid && f['firstName'].touched" />
          <small class="field-error" *ngIf="f['firstName'].invalid && f['firstName'].touched">First name is required.</small>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" formControlName="lastName" placeholder=""
            [class.input-error]="f['lastName'].invalid && f['lastName'].touched" />
          <small class="field-error" *ngIf="f['lastName'].invalid && f['lastName'].touched">Last name is required.</small>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" [placeholder]="emailPlaceholder"
          [class.input-error]="f['email'].invalid && f['email'].touched" />
        <small class="field-error" *ngIf="f['email'].invalid && f['email'].touched">Invalid email address.</small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••"
          [class.input-error]="f['password'].invalid && f['password'].touched"
          (input)="checkStrength($any($event.target).value)" />
        <div class="password-strength">
          <div class="strength-bar" [style.width]="strengthWidth" [style.background]="strengthColor"></div>
        </div>
        <small [style.color]="strengthColor" *ngIf="strengthLabel">{{ strengthLabel }}</small>
        <small class="field-error" *ngIf="f['password'].invalid && f['password'].touched">
          Minimum 6 characters.
        </small>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="••••••••"
          [class.input-error]="f['confirmPassword'].touched && registerForm.hasError('passwordMismatch')" />
        <small class="field-error"
          *ngIf="f['confirmPassword'].touched && registerForm.hasError('passwordMismatch')">
          Passwords do not match.
        </small>
      </div>

      <!-- Terms -->
      <div class="terms">
        <input type="checkbox" id="terms" formControlName="terms" />
        <label for="terms" class="terms-label">
          I accept the <a href="#">terms of use</a> and the <a href="#">privacy policy</a>
        </label>
      </div>

      <!-- Button -->
      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid || isLoading">
        <span class="spinner-ring" *ngIf="isLoading"></span>
        <span>{{ isLoading ? 'Creating account…' : 'Create my account ' + roleLabel }}</span>
      </button>

    </form>
  </div>

  <!-- Footer -->
  <div class="card-footer">
    Already have an account? <a routerLink="/login">Log in</a>
  </div>

</div>

  </div>
</div>
