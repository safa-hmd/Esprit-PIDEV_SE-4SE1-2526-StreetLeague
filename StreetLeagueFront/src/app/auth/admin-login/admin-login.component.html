<div class="admin-wrapper">
  <div class="card">

    <div class="card-head">
      <div class="logo">Street<span>League</span></div>
      <div class="admin-badge">🛡️ Administration</div>
      <h2>Administrator Access</h2>
      <p>Restricted interface for administrators only</p>
    </div>

    <div class="card-body">
      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <div class="form-group">
          <label for="email">Administrator Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="admin@streetleague.com"
            [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
          <small class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Invalid email address.
          </small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="••••••••"
            [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <small class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required.
          </small>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
          <span class="spinner-ring" *ngIf="isLoading"></span>
          <span>{{ isLoading ? 'Signing in...' : 'Access Admin Panel' }}</span>
        </button>

      </form>
    </div>

    <div class="card-footer">
      <a routerLink="/login">← Back to user login</a>
    </div>

  </div>
</div>
