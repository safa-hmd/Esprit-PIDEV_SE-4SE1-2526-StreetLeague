<div class="form-page">

  <!-- Hero Header -->
  <div class="form-hero">
    <div class="form-hero-content">
      <button (click)="cancel()" class="btn-back" id="btn-back-create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Back
      </button>
      <div class="hero-title">
        <div class="hero-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <div>
          <h1>Organiser un event</h1>
          <p>Créez un New Event pour votre community</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Form container -->
  <div class="form-container">

    <!-- Error alert -->
    <div *ngIf="error" class="alert alert-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ error }}
    </div>

    <div class="form-card">

      <!-- Section: Informations -->
      <div class="form-section">
        <div class="section-header">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <h2>Informations de l'event</h2>
        </div>

        <!-- Title -->
        <div class="form-group">
          <label for="title" class="form-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
            </svg>
            Title de l'event <span class="required">*</span>
          </label>
          <input
            type="text"
            id="title"
            [(ngModel)]="formData.titre"
            name="title"
            class="form-input"
            placeholder="Ex: Tournoi Basket Street Tunis 2025"
            [disabled]="loading"
          />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="description" class="form-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Description <span class="required">*</span>
          </label>
          <textarea
            id="description"
            [(ngModel)]="formData.description"
            name="description"
            class="form-textarea"
            rows="4"
            placeholder="Décrivez l'event, les règles, les objectifs..."
            [disabled]="loading"
          ></textarea>
        </div>
      </div>

      <!-- Divider -->
      <div class="section-divider"></div>

      <!-- Section: Details -->
      <div class="form-section">
        <div class="section-header">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <h2>Details & Organisation</h2>
        </div>

        <div class="form-row">
          <!-- Date -->
          <div class="form-group">
            <label for="date" class="form-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              Date de l'event <span class="required">*</span>
            </label>
            <input
              type="date"
              id="date"
              [(ngModel)]="formData.date"
              name="date"
              class="form-input"
              [disabled]="loading"
            />
          </div>

          <!-- Community -->
          <div class="form-group">
            <label for="communauteId" class="form-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Community <span class="required">*</span>
            </label>
            <div class="select-wrapper">
              <select
                id="communauteId"
                [(ngModel)]="formData.communauteId"
                name="communauteId"
                class="form-select"
                [disabled]="loading || loadingCommunautes"
              >
                <option [value]="0" disabled>
                  {{ loadingCommunautes ? 'Chargement...' : 'Select une community' }}
                </option>
                <option *ngFor="let c of communautes" [value]="c.id">
                  {{ c.nom }}
                </option>
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Organisateur info -->
        <div class="organizer-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span>Vous êtes l'organisateur de cet event (ID: {{ formData.organisateurId }})</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn-cancel" [disabled]="loading" id="btn-cancel-form">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          Cancel
        </button>
        <button type="button" (click)="save()" class="btn-save" [disabled]="loading" id="btn-save-event">
          <span *ngIf="!loading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
            </svg>
            Create l'event
          </span>
          <span *ngIf="loading" class="btn-loading">
            <span class="spinner"></span>
            Création in progress...
          </span>
        </button>
      </div>

    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

.form-page {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  background: #f4f6fa;
}

/* Hero */
.form-hero {
  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f3460 100%);
  padding: 0;
  position: relative;
  overflow: hidden;
}
.form-hero::before {
  content: '';
  position: absolute;
  top: -40%;
  right: -5%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255, 140, 66, 0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.form-hero-content {
  max-width: 800px;
  margin: 0 auto;
  padding: 24px;
  position: relative;
  z-index: 1;
}
.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.8);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
  margin-bottom: 20px;
}
.btn-back:hover { background: rgba(255,255,255,0.15); }
.btn-back svg { width: 16px; height: 16px; }

.hero-title {
  display: flex;
  align-items: center;
  gap: 16px;
}
.hero-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #ff8c42, #e61920);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(255, 140, 66, 0.4);
}
.hero-icon svg { width: 24px; height: 24px; stroke: white; }
.hero-title h1 {
  margin: 0 0 4px;
  color: white;
  font-size: 22px;
  font-weight: 800;
}
.hero-title p {
  margin: 0;
  color: rgba(255,255,255,0.55);
  font-size: 13px;
}

/* Form container */
.form-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

/* Alert */
.alert {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 500;
}
.alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.alert-error { background: #fdecea; border: 1px solid #f5c6cb; color: #c0392b; }
.alert-error svg { stroke: #c0392b; }

/* Form card */
.form-card {
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  border: 1px solid #edf0f7;
  overflow: hidden;
}

/* Sections */
.form-section { padding: 28px 28px 20px; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}
.section-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #ff8c42, #e61920);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.section-icon svg { width: 18px; height: 18px; stroke: white; }
.section-header h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: #1a1a2e;
}

.section-divider {
  height: 1px;
  background: #f0f2f7;
  margin: 0 28px;
}

/* Form groups */
.form-group { margin-bottom: 20px; }
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
}

.form-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  margin-bottom: 8px;
}
.form-label svg { width: 14px; height: 14px; stroke: #ff8c42; }
.required { color: #e61920; }

.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #e8ecf3;
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #1a1a2e;
  background: #fafbfd;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: #ff8c42;
  box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.12);
  background: white;
}
.form-input:disabled, .form-textarea:disabled, .form-select:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.form-textarea { resize: vertical; min-height: 100px; }

.select-wrapper { position: relative; }
.form-select { appearance: none; padding-right: 36px; cursor: pointer; }
.select-arrow {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  stroke: #999;
  pointer-events: none;
}

/* Organizer info */
.organizer-info {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(255,140,66,0.06), rgba(230,25,32,0.04));
  border: 1px solid rgba(255,140,66,0.2);
  border-radius: 10px;
  font-size: 13px;
  color: #c05621;
  font-weight: 500;
  margin-top: 4px;
}
.organizer-info svg { width: 16px; height: 16px; stroke: #ff8c42; flex-shrink: 0; }

/* Actions */
.form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 20px 28px 28px;
  border-top: 1px solid #f0f2f7;
}

.btn-cancel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  background: #f4f6fa;
  color: #666;
  border: 1.5px solid #e0e4ee;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}
.btn-cancel:hover:not(:disabled) { background: #e9ecf5; }
.btn-cancel:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel svg { width: 16px; height: 16px; }

.btn-save {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  background: linear-gradient(135deg, #ff8c42, #e61920);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(255, 140, 66, 0.35);
}
.btn-save > span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-save > span svg { width: 16px; height: 16px; }
.btn-save:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255, 140, 66, 0.45); }
.btn-save:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

.btn-loading {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
