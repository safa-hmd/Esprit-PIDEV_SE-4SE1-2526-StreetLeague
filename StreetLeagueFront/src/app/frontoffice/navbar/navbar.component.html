<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/home" class="navbar-logo">
      <div class="navbar-logo-icon">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
      </div>
      <span class="navbar-logo-text">Street<span>League</span></span>
    </a>

    <div class="navbar-links" [class.open]="menuOpen">
      <a routerLink="home"          routerLinkActive="active" class="nav-link">Home</a>
      <a routerLink="team"          routerLinkActive="active" class="nav-link">Teams</a>
      <a routerLink="match-history" routerLinkActive="active" class="nav-link"> matchs</a>
      <a routerLink="training"      routerLinkActive="active" class="nav-link">Training</a>
      <a routerLink="schedule" routerLinkActive="active" class="nav-link">📅Calendrier</a>
      <a routerLink="tournaments"   routerLinkActive="active" class="nav-link">Tournaments</a>
      <a routerLink="fields"        routerLinkActive="active" class="nav-link">Fields</a>
      <a routerLink="community"     routerLinkActive="active" class="nav-link">Community</a>
      <a routerLink="shop"          routerLinkActive="active" class="nav-link">Shop</a>
      <a routerLink="health"        routerLinkActive="active" class="nav-link">Health</a>
      <a routerLink="transport"     routerLinkActive="active" class="nav-link">Transport</a>
      <a routerLink="accommodation" routerLinkActive="active" class="nav-link">Lodging</a>
      <a routerLink="news"          routerLinkActive="active" class="nav-link">News</a>
    </div>

    <div class="navbar-actions">

      <!-- ══════════════════════════════════════════════════════════ -->
      <!-- NOTIFICATIONS DROPDOWN                                     -->
      <!-- ══════════════════════════════════════════════════════════ -->
   <div class="notif-menu" [class.open]="notifOpen">

  <!-- Trigger cloche -->
  <div class="notif-trigger" (click)="toggleNotif()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         style="width:22px;height:22px;">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
  </div>

  <!-- Panel -->
  <div class="notif-dropdown" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="notif-header">
      <span>Notifications</span>
      <button *ngIf="unreadCount > 0" class="mark-all-btn" (click)="markAllAsRead()">
        Tout marquer lu
      </button>
    </div>

    <!-- Filtres -->
    <div class="notif-filters">
      <button class="notif-filter-btn" [class.active]="activeFilter === 'all'"
              (click)="setFilter('all')">Tous</button>
      <button class="notif-filter-btn" [class.active]="activeFilter === 'unread'"
              (click)="setFilter('unread')">Non lus</button>
      <button class="notif-filter-btn" [class.active]="activeFilter === 'reminder'"
              (click)="setFilter('reminder')">Rappels</button>
      <button class="notif-filter-btn" [class.active]="activeFilter === 'closed'"
              (click)="setFilter('closed')">Résultats</button>
    </div>

    <!-- Liste -->
    <div class="notif-list">

      <div *ngIf="filteredNotifications.length === 0" class="notif-empty">
        Aucune notification
      </div>

      <div *ngFor="let n of filteredNotifications"
           class="notif-item"
           [class.unread]="!n.isRead">

        <!-- Icône colorée selon le type -->
        <div class="notif-type-icon"
             [style.background]="notifAccent(detectNotifType(n.message)) + '22'"
             [style.color]="notifAccent(detectNotifType(n.message))"
             (click)="markAsRead(n, $event)" style="cursor:pointer;">

          <!-- calendar (J-2) -->
          <svg *ngIf="notifIcon(detectNotifType(n.message)) === 'calendar'"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:15px;height:15px;">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>

          <!-- clock (J-1) -->
          <svg *ngIf="notifIcon(detectNotifType(n.message)) === 'clock'"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:15px;height:15px;">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>

          <!-- alert (H-2) -->
          <svg *ngIf="notifIcon(detectNotifType(n.message)) === 'alert'"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:15px;height:15px;">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>

          <!-- flag (match terminé) -->
          <svg *ngIf="notifIcon(detectNotifType(n.message)) === 'flag'"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:15px;height:15px;">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>

          <!-- bell (défaut) -->
          <svg *ngIf="notifIcon(detectNotifType(n.message)) === 'bell'"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:15px;height:15px;">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>

        <!-- Contenu -->
        <div class="notif-content" (click)="markAsRead(n, $event)" style="cursor:pointer; flex:1;">
          <p class="notif-message" [class.notif-unread-text]="!n.isRead">
            {{ n.message }}
          </p>
          <span class="notif-time">{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>

        <!-- Supprimer -->
        <button class="notif-delete-btn" (click)="deleteNotification(n, $event)" title="Supprimer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               style="width:14px;height:14px;">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

      <!-- ══════════════════════════════════════════════════════════ -->
      <!-- ACCOUNT DROPDOWN                                           -->
      <!-- ══════════════════════════════════════════════════════════ -->
      <div class="account-menu" (click)="toggleDropdown()" [class.open]="dropdownOpen">
        <div class="account-trigger">
          <div class="account-avatar">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </div>
          <div class="account-info">
            <span class="account-name">{{ userName }}</span>
            <span class="account-role">{{ userRole }}</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>

        <div class="account-dropdown" (click)="$event.stopPropagation()">
          <hr class="dropdown-divider"/>
          <a routerLink="profile" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            Mon Profil
          </a>
          <a routerLink="/settings" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Paramètres
          </a>
          <hr class="dropdown-divider"/>
          <button class="dropdown-item logout" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <button class="navbar-mobile-btn" (click)="toggleMenu()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>
</nav>
