
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetLeague – Accueil</title>



  <style>
    /* ── Hero ── */
    .hero{position:relative;min-height:500px;display:flex;align-items:center;background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url('https://images.unsplash.com/photo-1529900748604-07564a03e7a6?w=1400&auto=format&fit=crop') center/cover no-repeat;}
    .hero-content{max-width:1280px;margin:0 auto;padding:4rem 1.5rem;color:white;}
    .hero h1{font-family:'Barlow Condensed',sans-serif;font-size:3.5rem;font-weight:800;line-height:1.1;max-width:600px;letter-spacing:-0.02em;}
    .hero h1 span{color:#ff3d44;}
    .hero p{font-size:1.1rem;opacity:0.9;max-width:520px;margin:1rem 0 2rem;}
    .hero-btns{display:flex;gap:1rem;flex-wrap:wrap;}
    .btn-hero-primary{padding:0.8rem 2rem;background:var(--red);color:white;border-radius:8px;font-weight:700;font-size:1rem;transition:background 0.2s;}
    .btn-hero-primary:hover{background:var(--red-dark);}
    .btn-hero-outline{padding:0.8rem 2rem;border:2px solid white;color:white;border-radius:8px;font-weight:700;font-size:1rem;transition:all 0.2s;}
    .btn-hero-outline:hover{background:white;color:#000;}

    /* ── Stats Strip ── */
    .stats-strip{background:#111;color:white;padding:2rem 1.5rem;}
    .stats-strip-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;text-align:center;}
    .strip-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:2.2rem;font-weight:800;color:var(--red);}
    .strip-stat-label{font-size:0.82rem;color:#888;margin-top:0.2rem;text-transform:uppercase;letter-spacing:0.05em;}
    @media(max-width:640px){.stats-strip-inner{grid-template-columns:repeat(2,1fr);}.hero h1{font-size:2.4rem;}}

    /* ── Sections ── */
    .section{padding:4rem 1.5rem;}
    .section-dark{background:#f8f8f8;}
    .section-inner{max-width:1280px;margin:0 auto;}
    .section-title{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-0.02em;text-align:center;margin-bottom:0.5rem;}
    .section-sub{text-align:center;color:var(--gray-text);margin-bottom:2.5rem;}

    /* ── Feature Cards ── */
    .features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}
    @media(max-width:1024px){.features-grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:600px){.features-grid{grid-template-columns:1fr;}}
    .feature-card{background:white;border:1.5px solid #eee;border-radius:12px;padding:1.75rem;transition:all 0.2s;cursor:pointer;}
    .feature-card:hover{border-color:rgba(230,25,32,0.4);box-shadow:0 8px 30px rgba(230,25,32,0.12);transform:translateY(-2px);}
    .feature-icon{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;}
    .feature-icon svg{width:26px;height:26px;}
    .feature-title{font-weight:700;font-size:1rem;margin-bottom:0.35rem;}
    .feature-desc{font-size:0.87rem;color:var(--gray-text);margin-bottom:1rem;line-height:1.55;}
    .feature-link{font-size:0.85rem;font-weight:700;color:var(--red);}
    .feature-link:hover{text-decoration:underline;}

    /* ── Matches ── */
    .match-card{background:white;border:1.5px solid #eee;border-radius:12px;padding:1.5rem;transition:border-color 0.2s;}
    .match-card:hover{border-color:rgba(230,25,32,0.3);}
    .match-teams{display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;}
    .match-team{flex:1;text-align:center;font-weight:700;font-size:0.95rem;}
    .match-vs{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:800;color:var(--red);flex-shrink:0;}
    .match-meta{border-top:1px solid #eee;padding-top:1rem;display:flex;flex-direction:column;gap:0.4rem;}
    .match-meta-row{display:flex;align-items:center;gap:0.5rem;font-size:0.83rem;color:var(--gray-text);}
    .match-meta-row svg{width:14px;height:14px;flex-shrink:0;}

    /* ── CTA ── */
    .cta-section{background:var(--red);padding:4rem 1.5rem;text-align:center;color:white;}
    .cta-section h2{font-family:'Barlow Condensed',sans-serif;font-size:2.2rem;font-weight:800;}
    .cta-section p{font-size:1rem;opacity:0.9;margin:0.75rem auto 1.75rem;max-width:520px;}
    .btn-cta{display:inline-block;padding:0.8rem 2rem;background:white;color:var(--red);border-radius:8px;font-weight:700;font-size:1rem;transition:opacity 0.2s;}
    .btn-cta:hover{opacity:0.9;}
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <div class="navbar-logo-icon">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        </div>
        <span class="navbar-logo-text">Street<span>League</span></span>
      </a>
      
      
      <div class="navbar-actions">
        


    <div class="navbar-links" [class.open]="menuOpen">
      <a routerLink="home"          routerLinkActive="active" class="nav-link">Home</a>
      <a routerLink="team"          routerLinkActive="active" class="nav-link">Teams</a>
      <a routerLink="training"      routerLinkActive="active" class="nav-link">Training</a>
      <a routerLink="tournaments"   routerLinkActive="active" class="nav-link">Tournaments</a>
      <a routerLink="field-reservation" routerLinkActive="active" class="nav-link">Fields</a>
      <a routerLink="community"     routerLinkActive="active" class="nav-link">Community</a>
      <a routerLink="shop"          routerLinkActive="active" class="nav-link">Shop</a>
      <a routerLink="health"        routerLinkActive="active" class="nav-link">Health</a>
      <a routerLink="news"          routerLinkActive="active" class="nav-link">News</a>
    </div>

    <div class="navbar-actions">

      <!-- ACCOUNT DROPDOWN -->
      <div class="account-menu" (click)="toggleDropdown()" [class.open]="dropdownOpen">

        <!-- Trigger : avatar + nom + chevron -->
        <div class="account-trigger">
          <div class="account-avatar">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </div>
          <div class="account-info">
            <span class="account-name">{{ userName }}</span>
            <span class="account-role">{{ userRole }}</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>

        <!-- Dropdown Panel -->
        <div class="account-dropdown" (click)="$event.stopPropagation()">
          <hr class="dropdown-divider"/>
          <a routerLink="profile" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            Mon Profil
          </a>
          <a routerLink="/settings" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Paramètres
          </a>
          <hr class="dropdown-divider"/>
          <button class="dropdown-item logout" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <button class="navbar-mobile-btn" (click)="toggleMenu()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>
