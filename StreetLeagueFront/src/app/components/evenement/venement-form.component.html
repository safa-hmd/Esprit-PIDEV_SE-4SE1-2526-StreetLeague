<h2>Créer un Événement</h2>
<form (ngSubmit)="save()">
    <input [(ngModel)]="evenement.titre" name="titre" placeholder="Titre" required>
    <textarea [(ngModel)]="evenement.description" name="description" placeholder="Description"></textarea>
    <input [(ngModel)]="evenement.date" name="date" type="date" required>
    <button type="submit">Enregistrer</button>
</form>
