<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  .admin-page { min-height: 100vh; padding: 2rem; background: #0f1117; font-family: 'Inter', sans-serif; }
  .detail-card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 20px; max-width: 700px; margin: 0 auto; overflow: hidden; }
  .detail-header { background: linear-gradient(135deg, #1e2433, #2d3748); padding: 2rem; border-bottom: 1px solid #2d3748; display: flex; align-items: center; justify-content: space-between; }
  .detail-header h1 { font-size: 1.5rem; font-weight: 800; color: #f1f5f9; }
  .detail-header p { color: #94a3b8; font-size: 0.88rem; }
  .detail-body { padding: 2rem; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .info-item label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.35rem; }
  .info-item .value { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
  .badge { display: inline-block; padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
  .badge-gold { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .badge-silver { background: rgba(148,163,184,0.15); color: #cbd5e1; }
  .badge-bronze { background: rgba(217,119,6,0.15); color: #fbbf24; }
  .divider { border: none; border-top: 1px solid #2d3748; margin: 1.5rem 0; }
  .btn-back { background: #1e2433; color: #94a3b8; border: 1px solid #2d3748; padding: 0.75rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-back:hover { background: #2d3748; color: #e2e8f0; }
  .spinner, .error-msg { text-align: center; padding: 3rem; color: #64748b; }
</style>

<div class="admin-page">
  <div class="detail-card">
    <div class="spinner" *ngIf="loading">Chargement…</div>
    <div class="error-msg" *ngIf="error">⚠️ {{ error }}</div>
    <ng-container *ngIf="!loading && sponsor">
      <div class="detail-header">
        <div>
          <h1>💼 {{ sponsor.nom }}</h1>
          <p>Fiche sponsor — vue administrateur</p>
        </div>
        <span class="badge" [ngClass]="getTypeBadgeClass(sponsor.type)">{{ sponsor.type }}</span>
      </div>
      <div class="detail-body">
        <div class="info-grid">
          <div class="info-item">
            <label>ID</label>
            <div class="value">{{ sponsor.id }}</div>
          </div>
          <div class="info-item">
            <label>Nom</label>
            <div class="value">{{ sponsor.nom }}</div>
          </div>
          <div class="info-item">
            <label>Email de contact</label>
            <div class="value">{{ sponsor.contactEmail || '—' }}</div>
          </div>
          <div class="info-item">
            <label>Téléphone</label>
            <div class="value">{{ sponsor.telephone || '—' }}</div>
          </div>
          <div class="info-item" style="grid-column: 1 / -1;">
            <label>Adresse</label>
            <div class="value">{{ sponsor.adresse || '—' }}</div>
          </div>
        </div>
        <hr class="divider" />
        <button class="btn-back" (click)="back()" id="admin-back-sp-detail">← Retour à la liste</button>
      </div>
    </ng-container>
  </div>
</div>
