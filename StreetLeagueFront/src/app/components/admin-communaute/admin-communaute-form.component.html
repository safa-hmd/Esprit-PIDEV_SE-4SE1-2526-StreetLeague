<div class="admin-page">
  <div class="admin-page-header">
    <div class="page-title">
      <button (click)="cancel()" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div>
        <h1>Nouvelle communauté</h1>
        <p>Créer une communauté dans la plateforme</p>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-error">⚠ {{ error }}</div>

  <div class="form-card">
    <div class="form-grid">

      <div class="form-group">
        <label>Nom <span class="req">*</span></label>
        <input type="text" [(ngModel)]="formData.nom" name="nom" class="form-input" placeholder="Street Basket Tunis" [disabled]="loading"/>
      </div>

      <div class="form-group">
        <label>Type <span class="req">*</span></label>
        <div class="select-wrap">
          <select [(ngModel)]="formData.type" name="type" class="form-select" [disabled]="loading">
            <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
          </select>
          <svg class="select-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>

      <div class="form-group form-group-full">
        <label>Description <span class="req">*</span></label>
        <textarea [(ngModel)]="formData.description" name="description" class="form-textarea" rows="3" placeholder="Décrivez la communauté..." [disabled]="loading"></textarea>
      </div>

      <div class="form-group">
        <label>Date de création</label>
        <input type="date" [(ngModel)]="formData.dateCreation" name="dateCreation" class="form-input" [disabled]="loading"/>
      </div>

      <div class="form-group">
        <label>ID Créateur</label>
        <input type="number" [(ngModel)]="formData.createurId" name="createurId" class="form-input" [disabled]="loading"/>
      </div>

    </div>

    <div class="form-actions">
      <button (click)="cancel()" class="btn-cancel" [disabled]="loading">Annuler</button>
      <button (click)="save()" class="btn-save" [disabled]="loading" id="btn-save-comm">
        <span *ngIf="!loading">Créer la communauté</span>
        <span *ngIf="loading" class="btn-spin"><span class="mini-spinner"></span> En cours...</span>
      </button>
    </div>
  </div>
</div>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
.admin-page{padding:28px 32px;background:#f4f6fa;min-height:100vh;}
.admin-page-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
.page-title{display:flex;align-items:center;gap:12px;}
.btn-back{width:36px;height:36px;border:1.5px solid #e0e4ee;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.15s;}
.btn-back:hover{background:#f4f6fa;}
.btn-back svg{width:18px;height:18px;stroke:#555;}
.page-title h1{margin:0 0 2px;font-size:20px;font-weight:800;color:#1a1a2e;}
.page-title p{margin:0;font-size:13px;color:#888;}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:500;}
.alert-error{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;}
.form-card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #edf0f7;padding:28px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.form-group{display:flex;flex-direction:column;gap:7px;}
.form-group-full{grid-column:1/-1;}
.form-group label{font-size:13px;font-weight:600;color:#444;}
.req{color:#e61920;}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 13px;border:1.5px solid #e8ecf3;border-radius:9px;font-size:14px;color:#1a1a2e;background:#fafbfd;transition:border-color 0.2s,box-shadow 0.2s;font-family:'Inter',sans-serif;}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:#e61920;box-shadow:0 0 0 3px rgba(230,25,32,0.1);background:white;}
.form-textarea{resize:vertical;min-height:90px;}
.select-wrap{position:relative;}
.form-select{appearance:none;padding-right:36px;cursor:pointer;}
.select-arr{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#999;pointer-events:none;}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid #f0f2f7;}
.btn-cancel{padding:10px 20px;background:#f4f6fa;border:1.5px solid #e0e4ee;border-radius:9px;color:#666;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s;font-family:'Inter',sans-serif;}
.btn-cancel:hover{background:#e9ecf5;}
.btn-save{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:linear-gradient(135deg,#e61920,#ff3d44);color:white;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 12px rgba(230,25,32,0.3);font-family:'Inter',sans-serif;}
.btn-save:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(230,25,32,0.4);}
.btn-save:disabled{opacity:0.65;cursor:not-allowed;transform:none;}
.btn-spin{display:inline-flex;align-items:center;gap:8px;}
.mini-spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}</style>
