<div class="admin-page">
  <div class="form-header">
    <button (click)="cancel()" class="btn-back" id="btn-back-evt-edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m7-7-7 7 7 7"/></svg>
      Retour à la liste
    </button>
    <div class="page-title">
      <div class="page-title-icon icon-orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </div>
      <div>
        <h1>Modifier l'Événement #{{ evenementId }}</h1>
        <p>Mise à jour des informations de l'événement</p>
      </div>
    </div>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">✔ {{ successMessage }}</div>
  <div *ngIf="error" class="alert alert-error">⚠ {{ error }}</div>

  <div *ngIf="loading" class="loading-block"><div class="spinner"></div><span>Chargement...</span></div>

  <div *ngIf="!loading" class="form-card">
    <div class="form-section">
      <h2 class="section-title">Informations générales</h2>
      <div class="form-grid two-col">

        <div class="form-group form-group-full">
          <label class="form-label" for="titre">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h8m-8 6h16"/></svg>
            Titre *
          </label>
          <input id="titre" type="text" class="form-input" [(ngModel)]="formData.titre" [disabled]="saving">
        </div>

        <div class="form-group">
          <label class="form-label" for="date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Date de l'événement *
          </label>
          <input id="date" type="date" class="form-input" [(ngModel)]="formData.date" [disabled]="saving">
        </div>

        <div class="form-group">
          <label class="form-label" for="communauteId">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Communauté *
          </label>
          <div class="select-wrap">
            <select id="communauteId" class="form-select" [(ngModel)]="formData.communauteId"
              [disabled]="saving || loadingCommunautes">
              <option [value]="0" disabled>-- Sélectionner une communauté --</option>
              <option *ngFor="let c of communautes" [value]="c.id">{{ c.nom }} ({{ c.type }})</option>
            </select>
            <svg class="select-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>

        <div class="form-group form-group-full">
          <label class="form-label" for="description">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Description *
          </label>
          <textarea id="description" class="form-textarea" [(ngModel)]="formData.description"
            rows="4" [disabled]="saving"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="organisateurId">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ID Organisateur
          </label>
          <input id="organisateurId" type="number" class="form-input" [(ngModel)]="formData.organisateurId"
            min="1" [disabled]="saving">
        </div>

      </div>
    </div>

    <div class="form-actions">
      <button (click)="cancel()" class="btn-cancel" id="btn-cancel-evt-edit" [disabled]="saving">Annuler</button>
      <button (click)="save()" class="btn-save btn-save-orange" [disabled]="saving" id="btn-save-evt-edit">
        <div *ngIf="saving" class="btn-spinner"></div>
        <svg *ngIf="!saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        {{ saving ? 'Enregistrement...' : 'Enregistrer les modifications' }}
      </button>
    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
.admin-page{padding:28px 32px;background:#f4f6fa;min-height:100vh;}
.form-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.btn-back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:white;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#555;transition:all 0.2s;white-space:nowrap;}
.btn-back:hover{background:#f8f9fc;color:#333;}
.btn-back svg{width:15px;height:15px;}
.page-title{display:flex;align-items:center;gap:14px;}
.page-title-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.icon-orange{background:linear-gradient(135deg,#ea580c,#f97316);}
.page-title-icon svg{width:22px;height:22px;stroke:white;}
.page-title h1{margin:0 0 2px;font-size:20px;font-weight:800;color:#1a1a2e;}
.page-title p{margin:0;font-size:13px;color:#888;}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:500;}
.alert-success{background:#d4edda;color:#1a6b3a;border:1px solid #b8dfc5;}
.alert-error{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;}
.loading-block{display:flex;align-items:center;gap:12px;padding:48px;justify-content:center;color:#888;}
.spinner{width:22px;height:22px;border:2.5px solid #eee;border-top-color:#ea580c;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.form-card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #edf0f7;overflow:hidden;}
.form-section{padding:28px 32px;}
.section-title{font-size:15px;font-weight:700;color:#1a1a2e;margin:0 0 24px;padding-bottom:12px;border-bottom:2px solid #f4f6fa;}
.form-grid{display:grid;gap:20px;}
.two-col{grid-template-columns:1fr 1fr;}
@media(max-width:640px){.two-col{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:7px;}
.form-group-full{grid-column:1/-1;}
.form-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#374151;}
.form-label svg{width:15px;height:15px;stroke:#ea580c;}
.form-input,.form-select,.form-textarea{padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1a1a2e;background:#fafbfd;transition:border-color 0.2s,box-shadow 0.2s;outline:none;resize:vertical;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,0.1);background:white;}
.select-wrap{position:relative;}
.form-select{appearance:none;padding-right:36px;cursor:pointer;width:100%;}
.select-arr{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#999;pointer-events:none;}
.form-actions{padding:20px 32px;background:#fafbfd;border-top:1px solid #edf0f7;display:flex;justify-content:flex-end;gap:12px;}
.btn-cancel{padding:10px 20px;background:white;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-weight:600;color:#555;cursor:pointer;transition:all 0.2s;}
.btn-cancel:hover{background:#f4f6fa;}
.btn-save{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-save-orange{background:linear-gradient(135deg,#ea580c,#f97316);box-shadow:0 4px 12px rgba(234,88,12,0.3);}
.btn-save-orange:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(234,88,12,0.4);}
.btn-save:disabled{opacity:0.7;cursor:not-allowed;}
.btn-save svg{width:16px;height:16px;}
.btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;}
</style>
