<div class="edit-page">

  <!-- Loading state -->
  <div *ngIf="loading" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p>Chargement de la communauté...</p>
  </div>

  <!-- Edit Content -->
  <div *ngIf="!loading" class="edit-wrapper">

    <!-- Hero Header -->
    <div class="edit-hero">
      <div class="edit-hero-content">
        <button (click)="goBack()" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          Retour
        </button>
        <div class="edit-hero-title">
          <div class="edit-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </div>
          <div>
            <h1>Modifier la communauté</h1>
            <p class="edit-subtitle">Mettez à jour les informations de votre communauté</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="edit-container">

      <!-- Success message -->
      <div *ngIf="successMessage" class="alert alert-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ successMessage }}
      </div>

      <!-- Error message -->
      <div *ngIf="error" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

      <!-- Form card -->
      <div class="form-card">
        <form (ngSubmit)="onSubmit()" #editForm="ngForm">

          <!-- Nom -->
          <div class="form-group">
            <label for="nom" class="form-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Nom de la communauté <span class="required">*</span>
            </label>
            <input
              id="nom"
              type="text"
              [(ngModel)]="formData.nom"
              name="nom"
              required
              placeholder="Ex: Street Basket Tunis"
              class="form-input">
          </div>

          <!-- Type -->
          <div class="form-group">
            <label for="type" class="form-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/>
              </svg>
              Type <span class="required">*</span>
            </label>
            <div class="select-wrapper">
              <select id="type" [(ngModel)]="formData.type" name="type" required class="form-select">
                <option value="">-- Sélectionner un type --</option>
                <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label for="description" class="form-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              Description
            </label>
            <textarea
              id="description"
              [(ngModel)]="formData.description"
              name="description"
              rows="5"
              placeholder="Décrivez votre communauté..."
              class="form-textarea"></textarea>
          </div>

          <!-- Date -->
          <div class="form-group">
            <label for="dateCreation" class="form-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              Date de création
            </label>
            <input
              id="dateCreation"
              type="date"
              [(ngModel)]="formData.dateCreation"
              name="dateCreation"
              class="form-input">
          </div>

          <!-- Action buttons -->
          <div class="form-actions">
            <button type="submit" [disabled]="saving" class="btn-submit">
              <span *ngIf="!saving">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                </svg>
                Enregistrer les modifications
              </span>
              <span *ngIf="saving" class="saving-state">
                <span class="btn-spinner"></span>
                Enregistrement...
              </span>
            </button>
            <button type="button" (click)="goToList()" [disabled]="saving" class="btn-cancel">
              Annuler
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

.edit-page {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  background: #f4f6fa;
}

/* Loading */
.loading-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 16px;
  color: #666;
  font-size: 15px;
}
.loading-spinner {
  width: 44px;
  height: 44px;
  border: 3px solid #e8e8e8;
  border-top-color: #e61920;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Hero */
.edit-hero {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  padding: 0;
  position: relative;
  overflow: hidden;
}
.edit-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(230, 25, 32, 0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.edit-hero-content {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 24px 32px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.85);
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
  margin-bottom: 20px;
}
.back-btn:hover {
  background: rgba(255,255,255,0.18);
  color: white;
}
.back-btn svg { width: 16px; height: 16px; }

.edit-hero-title {
  display: flex;
  align-items: center;
  gap: 16px;
}
.edit-icon {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #e61920, #ff5f6d);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(230, 25, 32, 0.35);
}
.edit-icon svg { width: 26px; height: 26px; stroke: white; }

.edit-hero-title h1 {
  margin: 0 0 4px 0;
  color: white;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.edit-subtitle {
  margin: 0;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
}

/* Container */
.edit-container {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

/* Alerts */
.alert {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 500;
}
.alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.alert-success {
  background: #d4edda;
  border: 1px solid #b8dfc5;
  color: #1a6b3a;
}
.alert-success svg { stroke: #1a6b3a; }
.alert-error {
  background: #fdecea;
  border: 1px solid #f5c6cb;
  color: #c0392b;
}
.alert-error svg { stroke: #c0392b; }

/* Form card */
.form-card {
  background: white;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  border: 1px solid #edf0f7;
}

.form-group {
  margin-bottom: 22px;
}

.form-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.form-label svg { width: 15px; height: 15px; stroke: #e61920; flex-shrink: 0; }
.required { color: #e61920; }

.form-input, .form-textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #333;
  background: #fafbfc;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
  outline: none;
}
.form-input:focus, .form-textarea:focus {
  border-color: #e61920;
  box-shadow: 0 0 0 3px rgba(230, 25, 32, 0.08);
  background: white;
}
.form-textarea { resize: vertical; min-height: 120px; }

.select-wrapper {
  position: relative;
}
.form-select {
  width: 100%;
  padding: 12px 40px 12px 14px;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #333;
  background: #fafbfc;
  appearance: none;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
  box-sizing: border-box;
}
.form-select:focus {
  border-color: #e61920;
  box-shadow: 0 0 0 3px rgba(230, 25, 32, 0.08);
  background: white;
}
.select-arrow {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  stroke: #888;
  pointer-events: none;
}

/* Actions */
.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid #f0f0f0;
}

.btn-submit {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 20px;
  background: linear-gradient(135deg, #e61920, #ff3d44);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(230, 25, 32, 0.3);
}
.btn-submit:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(230, 25, 32, 0.4);
}
.btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
.btn-submit svg { width: 17px; height: 17px; }
.btn-submit span { display: flex; align-items: center; gap: 8px; }

.btn-cancel {
  padding: 13px 24px;
  background: #f4f6fa;
  color: #555;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-cancel:hover:not(:disabled) {
  background: #edf0f7;
  color: #333;
}
.btn-cancel:disabled { opacity: 0.65; cursor: not-allowed; }

.saving-state {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
</style>
