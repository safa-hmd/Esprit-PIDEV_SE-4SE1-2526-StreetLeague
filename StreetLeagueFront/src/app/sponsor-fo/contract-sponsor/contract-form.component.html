<div class="form-page">
  <div class="form-header">
    <button (click)="cancel()" class="back-btn" id="btn-back-contract-form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      Back
    </button>
    <div class="header-info">
      <h1>New Contract de Sponsoring</h1>
      <p>Remplissez les informations du contract</p>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-error">⚠ {{ error }}</div>

  <div class="form-card">
    <form (ngSubmit)="save()" #f="ngForm" novalidate>

      <div class="form-section">
        <div class="section-label">Parties concernées</div>
        <div class="form-row">
          <div class="form-group">
            <label for="sponsorId">ID Sponsor <span class="req">*</span></label>
            <input id="sponsorId" type="number" [(ngModel)]="formData.sponsorId" name="sponsorId"
                   placeholder="ex: 1" class="form-input" min="1" required>
          </div>
          <div class="form-group">
            <label for="equipeId">ID Équipe <span class="req">*</span></label>
            <input id="equipeId" type="number" [(ngModel)]="formData.equipeId" name="equipeId"
                   placeholder="ex: 1" class="form-input" min="1" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-label">Conditions financières</div>
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount (€) <span class="req">*</span></label>
            <input id="amount" type="number" [(ngModel)]="formData.montant" name="amount"
                   placeholder="0.00" class="form-input" min="0" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="status">Status <span class="req">*</span></label>
            <select id="status" [(ngModel)]="formData.statut" name="status" class="form-input" required>
              <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-label">Période de validité</div>
        <div class="form-row">
          <div class="form-group">
            <label for="dateDebut">Start Date <span class="req">*</span></label>
            <input id="dateDebut" type="date" [(ngModel)]="formData.dateDebut" name="dateDebut"
                   class="form-input" required>
          </div>
          <div class="form-group">
            <label for="dateFin">End Date <span class="req">*</span></label>
            <input id="dateFin" type="date" [(ngModel)]="formData.dateFin" name="dateFin"
                   class="form-input" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-label">Conditions contractuelles</div>
        <div class="form-group full-width">
          <label for="conditions">Conditions</label>
          <textarea id="conditions" [(ngModel)]="formData.conditions" name="conditions"
                    class="form-input" rows="4"
                    placeholder="Décrivez les conditions et obligations de ce contract..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn-cancel" id="btn-cancel-contract">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="loading" id="btn-submit-contract">
          <span *ngIf="loading" class="btn-spinner"></span>
          {{ loading ? 'Création...' : 'Create le contract' }}
        </button>
      </div>

    </form>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
.form-page{padding:32px;background:#f4f6fa;min-height:100vh;}
.form-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:white;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:#555;transition:all .2s;flex-shrink:0;margin-top:4px;}
.back-btn svg{width:16px;height:16px;}.back-btn:hover{background:#f1f5f9;color:#1a1a2e;}
.header-info h1{margin:0 0 4px;font-size:22px;font-weight:800;color:#1a1a2e;}
.header-info p{margin:0;font-size:13px;color:#888;}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:13px;font-weight:500;}
.alert-error{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;}
.form-card{background:white;border-radius:18px;box-shadow:0 2px 16px rgba(0,0,0,0.07);border:1px solid #edf0f7;padding:32px;}
.form-section{margin-bottom:28px;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#4f46e5;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #edf0f7;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.full-width{width:100%;}
.form-group label{font-size:13px;font-weight:600;color:#374151;}
.req{color:#ef4444;}
.form-input{padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#1a1a2e;transition:border-color .2s,box-shadow .2s;outline:none;background:white;width:100%;}
.form-input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.12);}
textarea.form-input{resize:vertical;}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid #f4f6fa;}
.btn-cancel{padding:11px 20px;background:white;border:1.5px solid #e5e7eb;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:#555;transition:all .2s;}
.btn-cancel:hover{background:#f1f5f9;}
.btn-submit{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(79,70,229,0.35);transition:all .2s;}
.btn-submit:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,0.45);}
.btn-submit[disabled]{opacity:.6;cursor:not-allowed;}
.btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:640px){.form-row{grid-template-columns:1fr;}}
</style>
