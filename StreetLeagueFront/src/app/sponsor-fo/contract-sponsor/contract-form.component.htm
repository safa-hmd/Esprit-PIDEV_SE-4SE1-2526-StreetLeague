<h2>Créer un Contrat Sponsor</h2>
<form (ngSubmit)="save()">
    <input [(ngModel)]="contrat.sponsorId" name="sponsorId" placeholder="Sponsor ID" required>
    <input [(ngModel)]="contrat.equipeId" name="equipeId" placeholder="Équipe ID" required>
    <input [(ngModel)]="contrat.montant" name="montant" type="number" placeholder="Montant" required>
    <input [(ngModel)]="contrat.dateDebut" name="dateDebut" type="date" required>
    <input [(ngModel)]="contrat.dateFin" name="dateFin" type="date" required>
    <input [(ngModel)]="contrat.statut" name="statut" placeholder="Statut">
    <textarea [(ngModel)]="contrat.conditions" name="conditions" placeholder="Conditions"></textarea>
    <button type="submit">Enregistrer</button>
</form>
