<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  .page-wrapper { min-height: 100vh; padding: 2rem; background: linear-gradient(135deg, #f4f6fb 0%, #e8edf7 100%); font-family: 'Inter', sans-serif; }
  .detail-card { background: white; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.1); max-width: 700px; margin: 0 auto; overflow: hidden; }
  .detail-header { background: linear-gradient(135deg, #8b5cf6, #7c3aed); padding: 2rem; color: white; display: flex; align-items: center; justify-content: space-between; }
  .detail-header h1 { font-size: 1.6rem; font-weight: 800; }
  .detail-header p { opacity: 0.85; font-size: 0.9rem; }
  .detail-body { padding: 2rem; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .info-item label { font-size: 0.78rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.35rem; }
  .info-item .value { font-size: 1rem; font-weight: 600; color: #1a1f36; }
  .badge { display: inline-block; padding: 0.3rem 0.9rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
  .badge-finance { background: #dbeafe; color: #1e40af; }
  .badge-materiel { background: #dcfce7; color: #166534; }
  .badge-service { background: #fef3c7; color: #92400e; }
  .badge-autre { background: #f3f4f6; color: #374151; }
  .divider { border: none; border-top: 1px solid #f3f4f6; margin: 1.5rem 0; }
  .action-bar { display: flex; gap: 1rem; margin-top: 1.5rem; }
  .btn-edit { flex: 1; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; padding: 0.75rem; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn-back { background: #f9fafb; color: #6b7280; border: 1.5px solid #e5e7eb; padding: 0.75rem 1.5rem; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .spinner, .error-msg { text-align: center; padding: 3rem; color: #9ca3af; }
</style>

<div class="page-wrapper">
  <div class="detail-card">
    <div class="spinner" *ngIf="loading">Chargement…</div>
    <div class="error-msg" *ngIf="error">⚠️ {{ error }}</div>
    <ng-container *ngIf="!loading && sponsoring">
      <div class="detail-header">
        <div>
          <h1>⚡ Sponsoring #{{ sponsoring.id }}</h1>
          <p>Details du sponsoring event</p>
        </div>
        <span class="badge" [ngClass]="getContribBadgeClass(sponsoring.typeContribution)">{{ sponsoring.typeContribution }}</span>
      </div>
      <div class="detail-body">
        <div class="info-grid">
          <div class="info-item">
            <label>ID</label>
            <div class="value">#{{ sponsoring.id }}</div>
          </div>
          <div class="info-item">
            <label>Contribution Type</label>
            <div class="value">{{ sponsoring.typeContribution }}</div>
          </div>
          <div class="info-item">
            <label>ID Sponsor</label>
            <div class="value">#{{ sponsoring.sponsorId }}</div>
          </div>
          <div class="info-item">
            <label>ID Event</label>
            <div class="value">#{{ sponsoring.evenementId }}</div>
          </div>
          <div class="info-item" style="grid-column: 1 / -1;">
            <label>Contribution</label>
            <div class="value" style="font-size:1.4rem;color:#8b5cf6;">{{ sponsoring.contribution | number:'1.2-2' }} €</div>
          </div>
        </div>
        <hr class="divider" />
        <div class="action-bar">
          <button class="btn-back" (click)="back()" id="btn-back-sp">← Back</button>
          <button class="btn-edit" (click)="edit()" id="btn-edit-sp-detail">✏️ Edit</button>
        </div>
      </div>
    </ng-container>
  </div>
</div>
