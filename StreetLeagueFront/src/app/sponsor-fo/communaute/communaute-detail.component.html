<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Details de la community</h2>
    <button class="btn btn-secondary" (click)="back()">
      <i class="bi bi-arrow-left"></i> Back
    </button>
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!loading && communaute" class="card">
    <div class="card-body">
      <h3 class="card-title">{{ communaute.nom }}</h3>
      <p class="card-text fs-5">{{ communaute.description }}</p>
      
      <div class="row mb-3">
        <div class="col-md-6">
          <strong><i class="bi bi-tag"></i> Type:</strong>
          <p>{{ communaute.type }}</p>
        </div>
        <div class="col-md-6">
          <strong><i class="bi bi-calendar"></i> Creation Date:</strong>
          <p>{{ formatDate(communaute.dateCreation) }}</p>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <strong><i class="bi bi-person"></i> Créateur ID:</strong>
          <p>{{ communaute.createurId }}</p>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-secondary" (click)="back()">
          <i class="bi bi-arrow-left"></i> Back to list
        </button>
      </div>
    </div>
  </div>
</div>
