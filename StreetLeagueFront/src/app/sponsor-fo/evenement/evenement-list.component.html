<app-sponsor-navbar></app-sponsor-navbar>

<div class="container mt-4" style="margin-top: 70px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Events disponibles pour sponsoring</h2>
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="!loading && evenements.length === 0" class="alert alert-info">
    none event disponible pour le moment.
  </div>

  <div class="row" *ngIf="!loading && evenements.length > 0">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let evenement of paginatedEvenements">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ evenement.titre }}</h5>
          <p class="card-text">{{ evenement.description }}</p>
          <div class="mb-2">
            <small class="text-muted">
              <i class="bi bi-calendar"></i> {{ formatDate(evenement.date) }}
            </small>
          </div>
          <div class="mb-2">
            <small class="text-muted">
              <i class="bi bi-people"></i> Community ID: {{ evenement.communauteId }}
            </small>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary btn-sm" (click)="viewDetail(evenement.id)">
              <i class="bi bi-eye"></i> Voir
            </button>
            <button *ngIf="canCreateSponsoring()" class="btn btn-success btn-sm" (click)="createSponsoring(evenement.id)">
              <i class="bi bi-hand-thumbs-up"></i> Sponsorer
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Pagination -->
  <div class="pagination" *ngIf="!loading && evenements.length > 0">
    <div class="pagination-controls">
      <button class="btn-pagination" (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
      <div class="pagination-pages">
        <button class="page-number" 
                *ngFor="let page of getPages()" 
                [class.active]="page === currentPage"
                (click)="onPageChange(page)">
          {{ page }}
        </button>
      </div>
      <button class="btn-pagination" (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
    </div>
    <div class="items-per-page">
      <label>Éléments par page:</label>
      <select (change)="onItemsPerPageChange()" [(ngModel)]="itemsPerPage">
        <option [ngValue]="3">3</option>
        <option [ngValue]="6">6</option>
        <option [ngValue]="9">9</option>
        <option [ngValue]="12">12</option>
      </select>
    </div>
    <span class="pagination-info">{{ totalItems }} events</span>
  </div>
</div>

<style>
/* Pagination Styles */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  padding: 1.5rem;
  margin-top: 2rem;
  border-top: 1px solid #dee2e6;
}

.btn-pagination {
  background: #f8f9fa;
  color: #6c757d;
  border: 1px solid #dee2e6;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-pagination:hover:not(:disabled) {
  background: #e9ecef;
  color: #495057;
}

.btn-pagination:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagination-info {
  color: #6c757d;
  font-size: 0.875rem;
  font-weight: 500;
}

.pagination-pages {
  display: flex;
  gap: 0.5rem;
}

.page-number {
  background: #f8f9fa;
  color: #6c757d;
  border: 1px solid #dee2e6;
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 2.5rem;
  text-align: center;
}

.page-number:hover {
  background: #e9ecef;
  color: #495057;
}

.page-number.active {
  background: #0d6efd;
  color: white;
  border-color: #0d6efd;
}

.pagination-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.items-per-page {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: #6c757d;
  font-size: 0.875rem;
}

.items-per-page select {
  background: white;
  border: 1px solid #dee2e6;
  padding: 0.375rem 0.75rem;
  border-radius: 6px;
  font-size: 0.875rem;
  color: #495057;
}
</style>
