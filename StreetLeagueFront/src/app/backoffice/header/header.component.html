<!-- ============== HEADER ============== -->
<header class="admin-header">
  
  <div class="header-left">
    <!-- SEARCH BAR (Pill Shape) -->
    <div class="search-pill">
      <span style="position:absolute; left:1rem; top:0.875rem; color:#888;">🔍</span>
      <input type="text" class="search-input" placeholder="Search athletes, fleet, or bookings...">
    </div>
  </div>

  <div class="header-right">
    <!-- NOTIFICATIONS -->
    <button class="header-icon" title="Notifications">
      🔔
      <span style="position:absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: #CC0000; border-radius: 50%; border: 2px solid white;"></span>
    </button>
    
    <!-- SETTINGS -->
    <button class="header-icon" title="Settings">⚙️</button>
    
    <!-- HELP -->
    <button class="header-icon" title="Help Centre">❓</button>

    <!-- USER PROXIMITY -->
    <div class="user-snippet">
      <div class="user-info">
        <span class="user-name">ADMINISTRATEUR</span>
        <span class="user-caption">Chief Logistics Officer</span>
      </div>
      <img src="https://ui-avatars.com/api/?name=Admin&background=CC0000&color=fff" alt="User Avatar" class="user-avatar">
    </div>

    <!-- LOGOUT -->
    <button class="header-icon" title="Logout" (click)="logout()">
      🚪
    </button>
  </div>

</header>
