<header class="admin-header">
  <div class="header-left">

    <button class="menu-toggle" (click)="toggleMenu()" [class.open]="menuOpen">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <!-- Theme Toggle -->

    <div class="header-logo">
      Street<span class="red">League</span>
      <span class="admin-badge">Admin</span>
    </div>

    <div class="header-divider"></div>

    <div class="header-breadcrumb">
      <span>Dashboard</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <span class="bc-current">{{ pageTitle }}</span>
    </div>

  </div>

  <div class="header-right">


 
    
<button class="icon-btn" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light' : 'Switch to Dark'">
  <!-- Moon — dark actif -->
  <svg *ngIf="isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <!-- Sun — light actif -->
  <svg *ngIf="!isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1"     x2="12" y2="3"/>
    <line x1="12" y1="21"    x2="12" y2="23"/>
    <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1"  y1="12" x2="3"  y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
    <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
  </svg>
</button>


    
    <div class="header-divider"></div>

    <!-- Account Dropdown -->
    <div class="account-wrap" (click)="toggleDropdown()" [class.open]="dropdownOpen">
      <div class="account-trigger">
        <div class="acct-avatar">{{ adminInitial }}</div>
        <div class="acct-info">
          <span class="acct-name">{{ adminName }}</span>
          <span class="acct-role">Super Admin</span>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>

      <div class="account-dropdown" (click)="$event.stopPropagation()">
        <div class="dd-header">
          <div class="dd-name">{{ adminName }}</div>
          <div class="dd-email">{{ adminEmail }}</div>
        </div>

        <button class="dd-item" routerLink="/admin/profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          My Profile
        </button>



        <hr class="dd-divider"/>

        <button class="dd-item danger" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </div>
    </div>

  </div>
</header>
