<div class="admin-page">
  <div class="form-header">
    <button (click)="cancel()" class="btn-back" id="btn-back-cont-form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m7-7-7 7 7 7"/></svg>
      Back to list
    </button>
    <div class="page-title">
      <div class="page-title-icon icon-indigo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <div>
        <h1>New Contract de Sponsoring</h1>
        <p>Create un contract entre un sponsor et une équipe</p>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-error">⚠ {{ error }}</div>

  <div class="form-card">
    <div class="form-section">
      <h2 class="section-title">Parties du contract</h2>
      <div class="form-grid two-col">
        <div class="form-group">
          <label class="form-label" for="sponsorId">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            ID Sponsor *
          </label>
          <input id="sponsorId" type="number" class="form-input" [(ngModel)]="formData.sponsorId" min="1" placeholder="Ex: 1">
        </div>
        <div class="form-group">
          <label class="form-label" for="equipeId">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ID Équipe *
          </label>
          <input id="equipeId" type="number" class="form-input" [(ngModel)]="formData.equipeId" min="1" placeholder="Ex: 1">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Details financiers & temporels</h2>
      <div class="form-grid three-col">
        <div class="form-group">
          <label class="form-label" for="amount">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><line x1="12" y1="6" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="18"/></svg>
            Amount (€) *
          </label>
          <input id="amount" type="number" class="form-input" [(ngModel)]="formData.montantTotal" min="0" step="500" placeholder="Ex: 10000">
        </div>
        <div class="form-group">
          <label class="form-label" for="dateDebut">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Start Date *
          </label>
          <input id="dateDebut" type="date" class="form-input" [(ngModel)]="formData.dateDebut">
        </div>
        <div class="form-group">
          <label class="form-label" for="dateFin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            End Date *
          </label>
          <input id="dateFin" type="date" class="form-input" [(ngModel)]="formData.dateFin">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Status & Conditions</h2>
      <div class="form-grid two-col">
        <div class="form-group">
          <label class="form-label" for="status">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Status *
          </label>
          <select id="status" class="form-select" [(ngModel)]="formData.statut">
            <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="form-group form-group-full">
          <label class="form-label" for="conditions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Conditions
          </label>
          <textarea id="conditions" class="form-textarea" [(ngModel)]="formData.conditions" rows="3" placeholder="Conditions particulières du contract..."></textarea>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button (click)="cancel()" class="btn-cancel" id="btn-cancel-cont-form">Cancel</button>
      <button (click)="save()" class="btn-save btn-save-indigo" [disabled]="loading" id="btn-save-cont-form">
        <div *ngIf="loading" class="btn-spinner"></div>
        <svg *ngIf="!loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        {{ loading ? 'Enregistrement...' : 'Create le contract' }}
      </button>
    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
.admin-page{padding:28px 32px;background:#f4f6fa;min-height:100vh;}
.form-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.btn-back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:white;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#555;transition:all 0.2s;white-space:nowrap;}
.btn-back:hover{background:#f8f9fc;color:#333;}
.btn-back svg{width:15px;height:15px;}
.page-title{display:flex;align-items:center;gap:14px;}
.page-title-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.icon-indigo{background:linear-gradient(135deg,#4f46e5,#6366f1);}
.page-title-icon svg{width:22px;height:22px;stroke:white;}
.page-title h1{margin:0 0 2px;font-size:20px;font-weight:800;color:#1a1a2e;}
.page-title p{margin:0;font-size:13px;color:#888;}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:500;}
.alert-error{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;}
.form-card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #edf0f7;overflow:hidden;}
.form-section{padding:28px 32px;border-bottom:1px solid #f4f6fa;}
.form-section:last-of-type{border-bottom:none;}
.section-title{font-size:15px;font-weight:700;color:#1a1a2e;margin:0 0 20px;padding-bottom:10px;border-bottom:2px solid #f4f6fa;}
.form-grid{display:grid;gap:20px;}
.two-col{grid-template-columns:1fr 1fr;}
.three-col{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:768px){.two-col,.three-col{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:7px;}
.form-group-full{grid-column:1/-1;}
.form-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#374151;}
.form-label svg{width:15px;height:15px;stroke:#4f46e5;}
.form-input,.form-select,.form-textarea{padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1a1a2e;background:#fafbfd;transition:border-color 0.2s,box-shadow 0.2s;outline:none;resize:vertical;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1);background:white;}
.form-actions{padding:20px 32px;background:#fafbfd;border-top:1px solid #edf0f7;display:flex;justify-content:flex-end;gap:12px;}
.btn-cancel{padding:10px 20px;background:white;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-weight:600;color:#555;cursor:pointer;transition:all 0.2s;}
.btn-cancel:hover{background:#f4f6fa;}
.btn-save{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-save-indigo{background:linear-gradient(135deg,#4f46e5,#6366f1);box-shadow:0 4px 12px rgba(79,70,229,0.3);}
.btn-save-indigo:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,70,229,0.4);}
.btn-save:disabled{opacity:0.7;cursor:not-allowed;}
.btn-save svg{width:16px;height:16px;}
.btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
